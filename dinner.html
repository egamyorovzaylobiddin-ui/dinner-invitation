
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Let's Plan Our Dinner ❤️</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <main class="invitation planning">

        <div class="heart">🥂</div>

        <p class="subtitle">THE BEGINNING OF SOMETHING SPECIAL</p>

        <h1>It's a Date, Feruza!</h1>

        <p class="question">
            I'm so happy you said yes! ❤️
        </p>

        <div class="planning-content">

            <div class="plan-item">
                <label for="date">📅 Choose Your Preferred Date</label>
                <select id="date" required>
                    <option value="">Choose a date</option>
                    <option value="2026-11-12">Thursday, November 12</option>
                    <option value="2026-11-13">Friday, November 13</option>
                    <option value="2026-11-14">Saturday, November 14</option>
                    <option value="2026-11-15">Sunday, November 15</option>
                </select>
            </div>

            <div class="plan-item">
                <label>🕕 Dinner Time</label>
                <div class="fixed-option">
                    18:00 (6:00 PM) ❤️
                </div>
            </div>

            <div class="plan-item">
                <label>🌹 A Little Dress Code Note</label>
                <p class="dress-message">
                    I'd love for you to wear whatever outfit
                    makes you feel most beautiful and comfortable. ❤️
                </p>
            </div>

            <div class="plan-item">
                <label for="food">🍽️ What Would You Like to Eat?</label>

                <select id="food" required>
                    <option value="">Choose your food preference</option>

                    <optgroup label="🔥 Shashlik">
                        <option>Beef Shashlik</option>
                        <option>Lamb Shashlik</option>
                        <option>Chicken Shashlik</option>
                        <option>Assorted Shashlik</option>
                    </optgroup>

                    <optgroup label="🍔 Fast Food">
                        <option>Beef Burger</option>
                        <option>Cheeseburger</option>
                        <option>Pizza</option>
                        <option>Fried Chicken</option>
                        <option>French Fries</option>
                        <option>Chicken Nuggets</option>
                    </optgroup>

                    <optgroup label="🍣 Sushi">
                        <option>Salmon Sushi</option>
                        <option>California Roll</option>
                        <option>Philadelphia Roll</option>
                        <option>Assorted Sushi Platter</option>
                    </optgroup>

                    <optgroup label="🍜 Ramen">
                        <option>Chicken Ramen</option>
                        <option>Beef Ramen</option>
                        <option>Spicy Ramen</option>
                        <option>Vegetable Ramen</option>
                    </optgroup>

                    <optgroup label="🍲 National Cuisine">
                        <option>Uzbek Plov</option>
                        <option>Manti</option>
                        <option>Lagman</option>
                        <option>Somsa</option>
                        <option>Shurpa</option>
                        <option>Norin</option>
                    </optgroup>

                    <option value="Surprise me! ❤️">
                        Surprise me! ❤️
                    </option>
                </select>
            </div>

            <button id="confirmBtn">
                Confirm Our Dinner ❤️
            </button>

        </div>

        <p class="footer">
            A beautiful evening awaits us...
        </p>

    </main>

    <script src="dinner.js"></script>

</body>
</html>
